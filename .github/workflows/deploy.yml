name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "APP_DIR='${{ secrets.EC2_APP_DIR }}' bash -s" <<'REMOTE'
            set -euo pipefail
            cd "${APP_DIR:-$HOME/saarthi}"

            git pull --ff-only origin main

            # Frontend: install, build, and let nginx serve dist/
            npm ci
            npm run build

            # Backend: install production deps and restart under pm2
            cd backend
            npm ci --omit=dev
            pm2 reload saarthi-api --update-env || pm2 start index.js --name saarthi-api
            pm2 save
          REMOTE
