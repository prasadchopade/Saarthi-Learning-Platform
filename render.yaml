# Render blueprint for the Saarthi API.
# Create the service from this file, then set the secret values in the
# Render dashboard - they are deliberately not stored in the repo.
services:
  - type: web
    name: saarthi-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      # Pinned deliberately. An open-ended engines range let Render install
      # Node 26, which removed SlowBuffer and broke jsonwebtoken's transitive
      # buffer-equal-constant-time dependency at require time.
      - key: NODE_VERSION
        value: 24.11.0
      # Puppeteer's postinstall downloads a ~150MB Chrome. It is only used by
      # the roadmap PDF export, and Chrome cannot launch inside the free
      # instance's 512MB anyway, so the download is skipped and that one
      # endpoint reports itself unavailable instead.
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: NODE_ENV
        value: production
      # Without this the API gates every first-time sign-in behind an approved
      # waitlist row, which closes the public demo to everyone.
      - key: REQUIRE_WAITLIST
        value: "false"
      - key: JWT_TIMEOUT
        value: 1d
      # PORT is deliberately NOT set here. Render injects its own PORT and
      # routes traffic to it; overriding it makes the app listen on the wrong
      # port and every request returns 502. index.js falls back to 5000 for
      # local development.
      # Set these in the dashboard:
      #   DB_URL                 MongoDB Atlas connection string
      #   JWT_SECRET             generate with: openssl rand -hex 48
      #   FRONTEND_URL           your Vercel URL (comma-separated if several)
      #   GOOGLE_CLIENT_ID       from Google Cloud console
      #   GOOGLE_CLIENT_SECRET   from Google Cloud console
      #   GOOGLE_REDIRECT_URL    the literal string: postmessage
      #   GEMINI_API_KEY         from aistudio.google.com
      #   ADMIN_EMAILS           your email, for the waitlist admin routes
      - key: DB_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
